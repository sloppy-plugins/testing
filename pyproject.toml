[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sloppy-testing"
version = "0.1.3"
description = "A Sloppy bubble workbench with immediate and input-driven testing actions"
authors = [{name = "Marat Abdullin", email = "ma@xrlt.net"}]
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/sloppy-plugins/testing"
Issues = "https://github.com/sloppy-plugins/testing/issues"

[tool.setuptools]
packages = ["sloppy_testing"]
package-dir = {sloppy_testing = "."}
include-package-data = false

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.setuptools.package-data]
sloppy_testing = [
    "plugin.json",
    "testing.cmd",
    "requirements.txt",
    "requirements-dev.txt",
    "README.md",
    "LICENSE",
    "AUTHORS",
    "Makefile",
    "pyproject.toml",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]

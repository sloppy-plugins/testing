name: Release

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build release packages
    if: github.event.release.prerelease == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.1.0
        with:
          python-version: '3.14'
      - name: Check the release tag and package versions
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: python release.py check-tag "$RELEASE_TAG"
      - name: Install, check, test, and package
        run: make deps check pack PYTHON=python
      - name: Save the checked Python distributions
        uses: actions/upload-artifact@v7.0.2
        with:
          name: python-packages
          path: dist/*
          if-no-files-found: error
          retention-days: 7
      - name: Save the installable plugin archive
        uses: actions/upload-artifact@v7.0.2
        with:
          name: plugin-archive
          path: build/*.zip
          if-no-files-found: error
          retention-days: 7

  pypi:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/sloppy-testing
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: python-packages
          path: dist
      - name: Publish the checked distributions with OIDC
        uses: pypa/gh-action-pypi-publish@v1.14.3

  assets:
    name: Attach the installable package to the GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8.0.2
        with:
          name: plugin-archive
          path: dist
      - name: Attach the checked package
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" dist/*.zip --repo "$RELEASE_REPO"
